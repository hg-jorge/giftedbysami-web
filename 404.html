<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Gifted by Sami</title>

<!-- Página autosuficiente (estilos aquí mismo): GitHub la muestra en cualquier dirección que no existe,
     y desde ahí las rutas relativas a assets/ podrían no funcionar. -->
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#f2ebe1;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .marca{font-family:"Times New Roman",Times,serif;font-size:clamp(44px,9vw,76px);line-height:.9;letter-spacing:-.02em;margin:0 0 28px}
  .marca i{display:block;font-size:.6em;margin:.1em 0}
  p{margin:0 0 30px;font-size:17px;letter-spacing:.05em;line-height:1.5}
  a{display:inline-block;padding:9px 30px;border:1.5px solid #fff;border-radius:999px;color:#f2ebe1;text-decoration:none;font-family:Avenir,"Avenir Next",system-ui,sans-serif;font-size:18px;transition:background .2s,color .2s}
  a:hover,a:focus-visible{background:#fff;color:#000;outline:none}
</style>
</head>
<body>
<!-- ===== SECCIÓN: error-404 ===== -->
<main>
  <h1 class="marca">GIFTED<i>by</i>SAMI</h1>
  <p>Ups, esta página no existe.<br>Pero el regalo perfecto sí.</p>
  <a id="a-home" href="/">regresar a home</a>
</main>
<script>
  // En la dirección temporal de GitHub el sitio vive en /giftedbysami-web/; con el dominio propio, en /
  if (location.hostname.endsWith('github.io')) document.getElementById('a-home').href = '/giftedbysami-web/';
</script>
<!-- ===== FIN: error-404 ===== -->
</body>
</html>
